name: Windows 桌面安装包

on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: 安装构建依赖
        working-directory: desktop
        run: |
          python -m pip install Jinja2==3.1.6
          npm ci
      # One desktop PR is one release: a version above every published desktop-v tag is new,
      # and merging it to master builds and publishes that Release in this same run.
      - name: 读取版本并核对是否为新版本
        id: version
        working-directory: desktop
        run: python scripts/version.py --check-release
      - name: 构建中文 NSIS 安装包及更新签名
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --bundles nsis -- --locked
          tagName: ${{ github.ref == 'refs/heads/master' && steps.version.outputs.new == 'true' && format('desktop-v{0}', steps.version.outputs.version) || '' }}
          releaseName: 词间 v${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.version.outputs.notes }}
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: Cijian_${{ steps.version.outputs.version }}_windows-x64
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 14
      # Publishing the draft creates the desktop-v tag on this commit.
      - name: 发布完整 Release 并设为最新版本
        if: github.ref == 'refs/heads/master' && steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/$env:RELEASE_ID" -F draft=false -f make_latest=true --silent
      # Branch builds still upload the installer for testing, then flag a PR that would not release.
      - name: 核对 PR 已升版本号
        if: github.ref != 'refs/heads/master' && steps.version.outputs.new != 'true'
        run: |
          Write-Output "::error::桌面版本 ${{ steps.version.outputs.version }} 已发布。每个桌面端 PR 就是一次发布：用 desktop/scripts/version.py --set 升版本号，并在 desktop/CHANGELOG.md 写这一版的更新说明。"
          exit 1
