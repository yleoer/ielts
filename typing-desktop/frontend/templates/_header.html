<header class="workspace-header" data-tauri-drag-region>
    <a class="workspace-brand" :inert="workspaceModalOpen || null" href="/index.html" aria-label="词间首页">
        <img src="/assets/favicon.svg?v=20261028-cijian" width="28" height="28" alt="">
        <span class="brand-name">词间</span>
    </a>
    <nav class="workspace-nav" :inert="workspaceModalOpen || null" aria-label="主导航">
        <a href="/index.html" aria-label="练习" class="nav-link {% if active_page == 'practice' %}is-active{% endif %}" {% if active_page == 'practice' %}aria-current="page"{% endif %}>
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#document"/></svg>
            <span>练习</span>
        </a>
        <a href="/stats.html" aria-label="统计" class="nav-link {% if active_page == 'stats' %}is-active{% endif %}" {% if active_page == 'stats' %}aria-current="page"{% endif %}>
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#chart"/></svg>
            <span>统计</span>
        </a>
    </nav>
    <div class="header-actions" :inert="workspaceModalOpen || null">
        <button ref="settingsButton" type="button" class="icon-button" @click="openServerSetup" aria-label="设置">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#settings"/></svg>
        </button>
        <button type="button" class="icon-button" @click="openSyncModal" aria-label="同步 Anki">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#sync"/></svg>
        </button>
    </div>
    <div class="window-controls" role="group" aria-label="窗口控制">
        <button type="button" class="icon-button window-control" data-window-action="minimize" aria-label="最小化">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#minimize"/></svg>
        </button>
        <button type="button" class="icon-button window-control" data-window-action="maximize" aria-label="最大化">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#maximize"/></svg>
        </button>
        <button type="button" class="icon-button window-control window-close" data-window-action="close" aria-label="关闭">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#close"/></svg>
        </button>
    </div>
</header>
