{{#Word}}
<main class="atlas-card atlas-question">
  <section class="atlas-recall">
    <h1 class="atlas-word" lang="en">{{Word}}</h1>
    <div class="atlas-pronunciations">
      {{#UK}}<span class="atlas-pronunciation"><small>UK</small><span lang="en">{{UK}}</span>{{AudioUK}}</span>{{/UK}}
      {{#US}}<span class="atlas-pronunciation"><small>US</small><span lang="en">{{US}}</span>{{AudioUS}}</span>{{/US}}
    </div>
    <span class="atlas-meta">{{Topic}} <b class="atlas-level">{{CEFR}}</b></span>
  </section>
</main>
{{/Word}}
