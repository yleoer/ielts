services:
  anki-sync:
    image: afrima/anki-sync-server:latest
    container_name: anki-sync-server
    user: "0:0"
    ports:
      - "${ANKI_SYNC_PORT:-8081}:8080"
    volumes:
      - ./data/anki-sync:/data
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SYNC_BASE: /data
      SYNC_PORT: 8080
      SYNC_USER1: "${ANKI_SYNC_USER:-ielts}:${ANKI_SYNC_PASSWORD:-ielts}"
    restart: unless-stopped
    networks:
      - ielts-network

  typing-practice:
    image: yleoer/ielts-typing-practice:latest
    container_name: ielts-typing-practice
    user: "0:0"
    ports:
      - "${TYPING_PRACTICE_PORT:-8080}:8080"
    volumes:
      - ./data/anki-sync:/app/anki-sync:ro
      - ./data/anki-cache:/app/anki-cache
      - ./data/stats:/app/stats
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ANKI_DB_PATH: /app/anki-cache/collection.anki2
      ANKI_SYNC_SOURCE_DIR: /app/anki-sync
      ANKI_SYNC_TARGET: /app/anki-cache/collection.anki2
      ANKI_SYNC_INTERVAL_SECONDS: "${ANKI_SYNC_INTERVAL_SECONDS:-300}"
      ANKI_SYNC_INITIAL_WAIT_SECONDS: "${ANKI_SYNC_INITIAL_WAIT_SECONDS:-60}"
      STATS_DB_PATH: /app/stats/stats.db
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/config >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - anki-sync
    networks:
      - ielts-network

networks:
  ielts-network:
    driver: bridge
