services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ielts-typing-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data:ro
      - stats-data:/app/stats
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ANKI_DB_PATH: /app/data/collection.anki2
      STATS_DB_PATH: /app/stats/stats.db
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/config >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ielts-network

volumes:
  stats-data:

networks:
  ielts-network:
    driver: bridge
