<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词间</title>
    {% include '_appearance.html' %}
</head>
<body class="login-page">
    <header class="login-brand workspace-brand"><img src="/assets/favicon.svg?v=20261028-cijian" width="28" height="28" alt=""><span class="brand-name">词间</span></header>
    <main class="login-sheet">
        <svg class="state-icon" aria-hidden="true"><use href="/assets/icons.svg#lock"/></svg>
        <h1>进入词间</h1>
        <p class="muted">输入访问密码以继续。</p>
        <form method="post">
            <label for="password" class="field-label">访问密码</label>
            <input id="password" class="password-input" name="password" type="password" autocomplete="current-password" required autofocus {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
            {% if error %}<p id="login-error" class="sr-only" role="alert">无法访问，请检查输入。</p>{% endif %}
            <button type="submit" class="button button-primary full-width">进入<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow"/></svg></button>
        </form>
    </main>
</body>
</html>
