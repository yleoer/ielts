<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进入</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: linear-gradient(180deg, #f8fafc, #eef2ff); color: #1e293b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 384px; padding: 36px 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; box-shadow: 0 12px 40px #1e293b08; }
        .password-field { position: relative; }
        .mark { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: block; color: #6366f1; pointer-events: none; }
        input, button { width: 100%; border-radius: 10px; font: inherit; }
        input { height: 46px; border: 1px solid #cbd5e1; padding: 0 12px 0 42px; color: #1e293b; background: #fff; }
        input:focus-visible { outline: 3px solid #e0e7ff; border-color: #6366f1; }
        input[aria-invalid="true"] { border-color: #dc2626; outline-color: #fee2e2; }
        button { height: 46px; margin-top: 18px; border: 0; background: #4f46e5; color: #fff; cursor: pointer; font-weight: 600; }
        button:hover { background: #4338ca; }
        button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        @media (max-width: 400px) { main { padding: 28px 24px; } }
    </style>
</head>
<body>
    <main>
        <form method="post">
            <div class="password-field">
                <input id="password" name="password" type="password" autocomplete="current-password" aria-label="访问密码" aria-required="true" autofocus {% if error %}aria-invalid="true"{% endif %}>
                <svg class="mark" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
            </div>
            <button type="submit">进入</button>
        </form>
    </main>
</body>
</html>
